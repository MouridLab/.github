name: Bug
description: Signaler un comportement reproductible
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Décrivez le comportement observé et le résultat attendu.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Étapes minimales, sans secret ni donnée personnelle.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sécurité
      options:
        - label: Ce rapport ne contient aucun secret ni donnée personnelle.
          required: true
